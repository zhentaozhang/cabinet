name: CI

on:
  push:
    branches: [main, "fix/**", "feat/**", "refactor/**"]
  pull_request:
  # Push-triggered runs never appeared for this repo (zero runs in its whole
  # history), so the gate could not be observed. A manual trigger makes it
  # possible to answer "is CI broken or did it just not fire" without
  # inventing a commit.
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cabinet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/cabinet_test
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/cabinet_test
      BETTER_AUTH_SECRET: ci-only-secret-not-for-production
      BETTER_AUTH_URL: http://localhost:3000
      AUTH_REQUIRED: "false"
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      # No `version` input: pnpm/action-setup@v4 reads `packageManager` from
      # package.json. Passing both makes the action abort with "Multiple
      # versions of pnpm specified" before a single project step runs — which
      # is what happened on the first run this workflow ever had.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Cheapest failure first: the README's generated numbers are compared
      # against the tree before a database exists. Same order as
      # scripts/verify.sh, so local and CI disagree about nothing.
      - run: pnpm doc:facts:check
      - run: pnpm db:migrate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
